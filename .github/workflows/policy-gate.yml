#
# Policy gate: regenerate the ACS policy from the committed ASSERT baseline and
# fail the build unless it still strongly blocks every known-bad output. This is
# the offline core loop, run in CI, with zero credentials.
# Manual only (Actions tab, Run workflow). See
# instructions/self-paced/more/lab-6-ci-gate.md to wire it to push or pull_request.
name: policy-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acs-policy-gate:
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: v0.70.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install OPA
        run: |
          url="https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          curl -fsSL -o opa "${url}"
          curl -fsSL -o opa.sha256 "${url}.sha256"
          echo "$(cut -d' ' -f1 opa.sha256)  opa" | sha256sum -c --quiet -
          sudo install -m 0755 opa /usr/local/bin/opa
          rm -f opa opa.sha256
          opa version

      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt

      - name: Regenerate the policy from the committed baseline
        env:
          PYTHONPATH: src
        run: python src/policy/generate_offline.py

      - name: Gate, every known-bad output must be strongly blocked
        run: |
          assert-ai acs validate \
            --manifest artifacts/acs/contoso-devbot-shell-abuse-v1/manifest.yaml \
            --run-dir data/results/contoso-devbot-shell-abuse-v1/baseline-unguarded \
            --require-block
